services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - /opt/snaptrip/hosted/shared/mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

