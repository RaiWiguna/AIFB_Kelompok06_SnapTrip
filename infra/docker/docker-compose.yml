services:
  postgres:
    image: postgres:16
    container_name: snaptrip-postgres
    environment:
      POSTGRES_DB: snaptrip
      POSTGRES_USER: snaptrip
      POSTGRES_PASSWORD: snaptrip
    ports:
      - "5432:5432"
    volumes:
      - snaptrip_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snaptrip -d snaptrip"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  snaptrip_postgres_data:
