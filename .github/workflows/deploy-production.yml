name: Deploy Production

on:
  push:
    branches:
      - dev
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to deploy to production
        required: true
        default: main

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.git_ref || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Run production build
        run: npm run build

      - name: Validate local Compose config
        run: docker compose config

      - name: Build local Compose images
        run: docker compose build

      - name: Validate remote Compose config
        run: docker compose --env-file deploy/env/runtime.production.env.example -f deploy/compose/docker-compose.remote.yml config

      - name: Build remote Compose images
        run: docker compose --env-file deploy/env/runtime.production.env.example -f deploy/compose/docker-compose.remote.yml build

  deploy:
    needs: validate
    if: >
      always() &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main') ||
       ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        needs.validate.result == 'success'))
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 75
    env:
      APP_ENV: production
      DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.git_ref || github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      REMOTE_BASE_DIR: /opt/snaptrip/hosted
      REMOTE_RUNTIME_ENV: /opt/snaptrip/hosted/shared/runtime.env
      REMOTE_HOST: ${{ secrets.PRODUCTION_VM_HOST }}
      REMOTE_USER: ${{ secrets.PRODUCTION_VM_USER }}
      REMOTE_PORT: ${{ secrets.PRODUCTION_VM_SSH_PORT != '' && secrets.PRODUCTION_VM_SSH_PORT || '22' }}
      WEB_DOMAIN: snaptrip.site
      API_DOMAIN: api.snaptrip.site

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}

      - name: Resolve release SHA
        run: echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate required secrets
        shell: bash
        env:
          PRODUCTION_VM_HOST: ${{ secrets.PRODUCTION_VM_HOST }}
          PRODUCTION_VM_USER: ${{ secrets.PRODUCTION_VM_USER }}
          PRODUCTION_VM_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_VM_SSH_PRIVATE_KEY }}
          PRODUCTION_VM_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_VM_SSH_KNOWN_HOSTS }}
          PRODUCTION_CADDY_EMAIL: ${{ secrets.PRODUCTION_CADDY_EMAIL }}
          PRODUCTION_SESSION_SECRET: ${{ secrets.PRODUCTION_SESSION_SECRET }}
          PRODUCTION_MONGO_ROOT_USERNAME: ${{ secrets.PRODUCTION_MONGO_ROOT_USERNAME }}
          PRODUCTION_MONGO_ROOT_PASSWORD: ${{ secrets.PRODUCTION_MONGO_ROOT_PASSWORD }}
          PRODUCTION_MONGO_DATABASE: ${{ secrets.PRODUCTION_MONGO_DATABASE }}
          PRODUCTION_GEMINI_API_KEY: ${{ secrets.PRODUCTION_GEMINI_API_KEY }}
          PRODUCTION_GOOGLE_PLACES_API_KEY: ${{ secrets.PRODUCTION_GOOGLE_PLACES_API_KEY }}
          PRODUCTION_GOOGLE_MAPS_BROWSER_API_KEY: ${{ secrets.PRODUCTION_GOOGLE_MAPS_BROWSER_API_KEY }}
        run: |
          for name in \
            PRODUCTION_VM_HOST \
            PRODUCTION_VM_USER \
            PRODUCTION_VM_SSH_PRIVATE_KEY \
            PRODUCTION_VM_SSH_KNOWN_HOSTS \
            PRODUCTION_CADDY_EMAIL \
            PRODUCTION_SESSION_SECRET \
            PRODUCTION_MONGO_ROOT_USERNAME \
            PRODUCTION_MONGO_ROOT_PASSWORD \
            PRODUCTION_MONGO_DATABASE \
            PRODUCTION_GEMINI_API_KEY \
            PRODUCTION_GOOGLE_PLACES_API_KEY \
            PRODUCTION_GOOGLE_MAPS_BROWSER_API_KEY; do
            value="${!name}"
            if [[ -z "${value// }" ]]; then
              echo "Missing required secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_VM_SSH_PRIVATE_KEY }}

      - name: Configure known hosts
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PRODUCTION_VM_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare remote directories
        run: |
          ssh -p "$REMOTE_PORT" "$REMOTE_USER@$REMOTE_HOST" \
            "mkdir -p '$REMOTE_BASE_DIR/releases/$RELEASE_SHA' '$REMOTE_BASE_DIR/shared'"

      - name: Capture previous release
        run: |
          PREVIOUS_RELEASE=$(ssh -p "$REMOTE_PORT" "$REMOTE_USER@$REMOTE_HOST" "if [ -f '$REMOTE_BASE_DIR/current_release' ]; then cat '$REMOTE_BASE_DIR/current_release'; fi")
          echo "PREVIOUS_RELEASE=$PREVIOUS_RELEASE" >> "$GITHUB_ENV"

      - name: Upload source release archive
        run: |
          git archive --format=tar "$RELEASE_SHA" \
            | ssh -p "$REMOTE_PORT" "$REMOTE_USER@$REMOTE_HOST" \
              "tar -xf - -C '$REMOTE_BASE_DIR/releases/$RELEASE_SHA'"

      - name: Render runtime env
        env:
          PRODUCTION_CADDY_EMAIL: ${{ secrets.PRODUCTION_CADDY_EMAIL }}
          PRODUCTION_SESSION_SECRET: ${{ secrets.PRODUCTION_SESSION_SECRET }}
          PRODUCTION_MONGO_ROOT_USERNAME: ${{ secrets.PRODUCTION_MONGO_ROOT_USERNAME }}
          PRODUCTION_MONGO_ROOT_PASSWORD: ${{ secrets.PRODUCTION_MONGO_ROOT_PASSWORD }}
          PRODUCTION_MONGO_DATABASE: ${{ secrets.PRODUCTION_MONGO_DATABASE }}
          PRODUCTION_GEMINI_API_KEY: ${{ secrets.PRODUCTION_GEMINI_API_KEY }}
          PRODUCTION_GOOGLE_PLACES_API_KEY: ${{ secrets.PRODUCTION_GOOGLE_PLACES_API_KEY }}
          PRODUCTION_GOOGLE_MAPS_BROWSER_API_KEY: ${{ secrets.PRODUCTION_GOOGLE_MAPS_BROWSER_API_KEY }}
        run: |
          {
            printf '%s\n' "APP_ENV=production"
            printf '%s\n' "RELEASE_SHA=$RELEASE_SHA"
            printf '%s\n' "COMPOSE_PROJECT_NAME=snaptrip-production"
            printf '%s\n' "SHARED_DIR=/opt/snaptrip/hosted/shared"
            printf '%s\n' "WEB_DOMAIN=$WEB_DOMAIN"
            printf '%s\n' "API_DOMAIN=$API_DOMAIN"
            printf '%s\n' "CADDY_EMAIL=$PRODUCTION_CADDY_EMAIL"
            printf '%s\n' "MONGO_ROOT_USERNAME=$PRODUCTION_MONGO_ROOT_USERNAME"
            printf '%s\n' "MONGO_ROOT_PASSWORD=$PRODUCTION_MONGO_ROOT_PASSWORD"
            printf '%s\n' "MONGO_DATABASE=$PRODUCTION_MONGO_DATABASE"
            printf '%s\n' "SESSION_SECRET=$PRODUCTION_SESSION_SECRET"
            printf '%s\n' "COOKIE_DOMAIN=$WEB_DOMAIN"
            printf '%s\n' "GRIDFS_BUCKET=snaptrip_images"
            printf '%s\n' "CLASSIFIER_MODEL_PATH=/app/models/snaptrip_mobilenetv4_medium_v2_best.pth"
            printf '%s\n' "CLASSIFIER_MODE=real"
            printf '%s\n' "CLASSIFIER_MODEL_VERSION=2026-05-mvp-mobilenetv4-medium-v2"
            printf '%s\n' "GEMINI_API_KEY=$PRODUCTION_GEMINI_API_KEY"
            printf '%s\n' "GEMINI_MODEL=gemini-3.5-flash"
            printf '%s\n' "GOOGLE_PLACES_API_KEY=$PRODUCTION_GOOGLE_PLACES_API_KEY"
            printf '%s\n' "NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_API_KEY=$PRODUCTION_GOOGLE_MAPS_BROWSER_API_KEY"
            printf '%s\n' "AI_PROVIDER_TIMEOUT_SECONDS=30"
            printf '%s\n' "AI_OBSERVABILITY_ENABLED=true"
            printf '%s\n' "AI_RAW_LLM_OBSERVABILITY=true"
            printf '%s\n' "AI_RAW_LLM_LOGS=false"
            printf '%s\n' "AI_OBSERVABILITY_TTL_SECONDS=604800"
            printf '%s\n' "AI_OBSERVABILITY_MAX_FIELD_BYTES=262144"
            printf '%s\n' "PLACES_CACHE_TTL_SECONDS=604800"
            printf '%s\n' "MAX_UPLOAD_IMAGE_BYTES=8388608"
            printf '%s\n' "MAX_UPLOAD_IMAGES=8"
          } > runtime.env

      - name: Upload runtime env atomically
        run: |
          tmp_file="$REMOTE_RUNTIME_ENV.$RELEASE_SHA.tmp"
          cat runtime.env | ssh -p "$REMOTE_PORT" "$REMOTE_USER@$REMOTE_HOST" \
            "umask 077 && cat > '$tmp_file' && mv -f '$tmp_file' '$REMOTE_RUNTIME_ENV'"

      - name: Run VM preflight
        run: |
          ssh -p "$REMOTE_PORT" "$REMOTE_USER@$REMOTE_HOST" \
            "bash '$REMOTE_BASE_DIR/releases/$RELEASE_SHA/deploy/scripts/remote-preflight.sh' \
             '$APP_ENV' '$RELEASE_SHA' '$REMOTE_BASE_DIR' '$REMOTE_RUNTIME_ENV' \
             '$WEB_DOMAIN' '$API_DOMAIN' '$REMOTE_HOST'"

      - name: Deploy on VM
        run: |
          ssh -p "$REMOTE_PORT" "$REMOTE_USER@$REMOTE_HOST" \
            "bash '$REMOTE_BASE_DIR/releases/$RELEASE_SHA/deploy/scripts/remote-deploy.sh' \
             '$APP_ENV' '$RELEASE_SHA' '$REMOTE_BASE_DIR' '$REMOTE_RUNTIME_ENV' '$PREVIOUS_RELEASE' \
             'https://$WEB_DOMAIN' 'https://$API_DOMAIN/health' 'https://$API_DOMAIN/ready'"

      - name: Smoke-check production
        env:
          SMOKE_RETRY_COUNT: 60
          SMOKE_RETRY_DELAY: 5
        run: |
          bash deploy/scripts/smoke-check.sh \
            "https://$WEB_DOMAIN" \
            "https://$API_DOMAIN/health" \
            "https://$API_DOMAIN/ready"

      - name: Validate readiness payload
        run: bash deploy/scripts/assert-ready.sh "https://$API_DOMAIN/ready"

      - name: Rollback production on failed validation
        if: failure() && env.PREVIOUS_RELEASE != ''
        run: |
          ssh -p "$REMOTE_PORT" "$REMOTE_USER@$REMOTE_HOST" \
            "bash '$REMOTE_BASE_DIR/releases/$PREVIOUS_RELEASE/deploy/scripts/remote-rollback.sh' \
             '$APP_ENV' '$PREVIOUS_RELEASE' '$REMOTE_BASE_DIR' '$REMOTE_RUNTIME_ENV' \
             'https://$WEB_DOMAIN' 'https://$API_DOMAIN/health' 'https://$API_DOMAIN/ready'"
