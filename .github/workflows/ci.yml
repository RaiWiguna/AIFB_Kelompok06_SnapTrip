name: CI

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - ".agents/**"
      - "docs/**"
      - "training/**"
      - "drafts/**"
      - "examples/**"
      - "*.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - ".agents/**"
      - "docs/**"
      - "training/**"
      - "drafts/**"
      - "examples/**"
      - "*.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Run production build
        run: npm run build

      - name: Validate local Compose config
        run: docker compose config

      - name: Build local Compose images
        run: docker compose build

      - name: Validate remote Compose config
        run: docker compose --env-file deploy/env/runtime.production.env.example -f deploy/compose/docker-compose.remote.yml config

      - name: Build remote Compose images
        run: docker compose --env-file deploy/env/runtime.production.env.example -f deploy/compose/docker-compose.remote.yml build
