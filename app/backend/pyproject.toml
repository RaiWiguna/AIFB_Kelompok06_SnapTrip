[project]
name = "snaptrip-backend"
version = "0.1.0"
description = "SnapTrip FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=23.1.0",
  "email-validator>=2.2.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "motor>=3.7.0",
  "pillow>=11.0.0",
  "pydantic-settings>=2.7.0",
  "pymongo>=4.10.0",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.34.0"
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.9.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
