services:
  mongo:
    image: mongo:7
    container_name: snaptrip-local-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - snaptrip_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  snaptrip_mongo_data:
